<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食咩好？ — 帳戶刪除</title><body style="font:18px/1.7 system-ui;max-width:760px;margin:40px auto;padding:20px"><h1>帳戶刪除</h1><p><strong>未發佈測試範本；營運者及聯絡資料待填。</strong></p><p>在 App「帳戶」登入後按「刪除帳戶」並確認。會移除 Auth 身份、暱稱、評分與評論；公開餐廳修改保留，歷史作者匿名化。無法開啟 App 時，可向營運者提交刪除請求。正式發佈前必須提供可用的聯絡方式及身份核實流程。</p><p>© OpenStreetMap contributors · <a href="https://www.openstreetmap.org/copyright">ODbL 署名與授權</a></p></body></html>
