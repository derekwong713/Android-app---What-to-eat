<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食咩好？ — 私隱政策</title><body style="font:18px/1.7 system-ui;max-width:760px;margin:40px auto;padding:20px"><h1>私隱政策</h1><p><strong>未發佈測試範本；營運者及聯絡資料待填。</strong></p><p>本測試服務使用裝置位置計算直線距離。位置只在有限距離查詢時傳送，不儲存於候選快照。Google／Facebook 經 Supabase Auth 登入；公開評論顯示暱稱。AdMob／UMP 處理適用的廣告識別與同意。請勿在公開內容輸入私人資料。帳戶評分及評論刪除後移除，餐廳修改與匿名修改紀錄保留。正式營運前須填寫資料控制者、聯絡方法、保留期限及適用地區披露。</p><p>© OpenStreetMap contributors · <a href="https://www.openstreetmap.org/copyright">ODbL 署名與授權</a></p></body></html>
